<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Is Application Architecture? — Visual Presentation</title>
  <meta name="description" content="A simple, visual explanation of application architecture using WhatsApp as a real-world example.">
  
  <!-- Clean Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="presentation-body">

  <div class="deck-viewport">

    <!-- Minimalist Clean Top Navbar -->
    <header class="deck-navbar">
      <div class="nav-left">
        <div class="guide-avatar" title="Xiaohei Guide">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <path d="M16 4 C23 4 26 10 26 20 C26 27 22 29 16 29 C10 29 6 27 6 20 C6 10 9 4 16 4 Z" fill="#18181b"/>
            <circle cx="13" cy="14" r="2" fill="#ffffff"/>
            <circle cx="19" cy="14" r="2" fill="#ffffff"/>
          </svg>
        </div>
        <div class="deck-meta">
          <span class="series-tag">ARCHITECTURE 101</span>
          <span class="meta-sep">/</span>
          <span class="deck-subject">Understanding How Apps Work</span>
        </div>
      </div>

      <!-- Slide Navigation Tabs (Left & Right Slider Tabs) -->
      <nav class="nav-center" aria-label="Slide Selection">
        <button class="slide-nav-pill active" data-slide="0" id="tab-slide-0">
          <span class="pill-idx">01</span>
          <span class="pill-label">WhatsApp Architecture</span>
        </button>
        <button class="slide-nav-pill" data-slide="1" id="tab-slide-1">
          <span class="pill-idx">02</span>
          <span class="pill-label">Server vs. Serverless</span>
        </button>
      </nav>

      <!-- Utility Actions -->
      <div class="nav-right">
        <button class="action-icon-btn" id="btn-sound" title="Toggle Sound FX (Key: M)" aria-label="Toggle Sound">
          <svg class="sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="sound-icon-off hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
          <span class="action-caption">Sound</span>
        </button>

        <button class="action-icon-btn" id="btn-fullscreen" title="Toggle Fullscreen (Key: F)" aria-label="Toggle Fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Horizontal Sliding Track (Smooth Left/Right Slide Moving) -->
    <main class="slider-container" id="slider-container">
      <div class="slider-track" id="slider-track">

        <!-- =======================================================
             SLIDE 1: What Is Application Architecture? (Image Alone)
             ======================================================= -->
        <section class="slide-card" id="slide-0" aria-label="Slide 1: What Is Application Architecture?">
          <div class="slide-stage-solo">
            <img 
              src="assets/slide1_whatsapp_arch.jpg" 
              alt="What Is Application Architecture? Client (Frontend), Network (Transit), Server (Backend & DB)" 
              class="slide-hero-image"
              id="img-slide-1"
            />
          </div>
        </section>

        <!-- =======================================================
             SLIDE 2: Where Does the Server Live? (Image Alone)
             ======================================================= -->
        <section class="slide-card" id="slide-1" aria-label="Slide 2: Where Does the Server Live?">
          <div class="slide-stage-solo">
            <img 
              src="assets/slide2_server_vs_serverless.jpg" 
              alt="Where Does the Server Live? Dedicated Servers vs. Serverless Functions" 
              class="slide-hero-image"
              id="img-slide-2"
            />
          </div>
        </section>

      </div>
    </main>

    <!-- Bottom Presentation Controller & Slide Indicator -->
    <footer class="deck-bottom-bar">
      <div class="footer-left">
        <button class="slide-nav-btn btn-prev" id="btn-prev" title="Previous Slide (Key: Left Arrow)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>Previous</span>
        </button>

        <span class="slide-counter" id="slide-counter-display">
          <strong id="current-slide-num">01</strong> / <span id="total-slide-num">02</span>
        </span>

        <button class="slide-nav-btn btn-next" id="btn-next" title="Next Slide (Key: Space / Right Arrow)">
          <span>Next</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Quick Slide Dots Indicator -->
      <div class="footer-center">
        <div class="slide-dots-container">
          <button class="dot-btn active" data-slide="0" aria-label="Slide 1"></button>
          <button class="dot-btn" data-slide="1" aria-label="Slide 2"></button>
        </div>
      </div>

      <div class="footer-right">
        <div class="keyboard-hint-pill">
          <kbd class="key-cap">←</kbd> <kbd class="key-cap">→</kbd> Slide Move
          <span class="key-sep">&bull;</span>
          <kbd class="key-cap">Space</kbd> Next
          <span class="key-sep">&bull;</span>
          <kbd class="key-cap">F</kbd> Fullscreen
        </div>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
